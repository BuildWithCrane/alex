<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALEXANDRIA // ARCHIVE</title>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2280%22 fill=%22%23121212%22>📖</text></svg>">
    
    <style>
        :root {
            --concrete: #e0e0e0;
            --void: #121212;
            --accent: #ffffff;
            --ink-blue: #0047ab;
            --star-gold: #f1b51c;
        }

        body {
            background-color: var(--concrete);
            font-family: "Georgia", serif;
            margin: 0;
            display: flex;
            min-height: 100vh;
        }

        /* The Binding Side-Bar */
        .binding {
            width: 80px;
            background: var(--void);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 40px;
            border-right: 2px solid var(--void);
            position: fixed;
            height: 100vh;
            z-index: 1000;
        }

        .binding-text {
            writing-mode: vertical-rl;
            text-transform: uppercase;
            color: var(--accent);
            font-weight: 900;
            letter-spacing: 10px;
            font-size: 24px;
            transform: rotate(180deg);
        }

        /* Main Content Area */
        .main-stage {
            flex-grow: 1;
            padding: 60px 60px 40px 140px;
            max-width: 1300px;
            display: flex;
            flex-direction: column;
        }

        header {
            border-bottom: 10px solid var(--void);
            margin-bottom: 50px;
            padding-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .title-block h1 {
            font-family: Arial, sans-serif;
            font-size: 80px;
            font-weight: 900;
            margin: 0;
            line-height: 0.8;
            letter-spacing: -4px;
            text-transform: uppercase;
        }

        .title-block p {
            margin: 10px 0 0 5px;
            font-style: italic;
            font-size: 18px;
            color: #444;
        }

        .search-shelf {
            margin-bottom: 60px;
        }

        .search-shelf input {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 4px solid var(--void);
            font-size: 32px;
            font-family: "Georgia", serif;
            padding: 10px 0;
            outline: none;
        }

        .stacks {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 40px;
            flex-grow: 1;
        }

        .folio-card {
            background: var(--accent);
            border: 1px solid #ccc;
            padding: 20px;
            box-shadow: 15px 15px 0px rgba(0,0,0,0.05);
            transition: all 0.2s;
            cursor: pointer;
            display: flex;
            flex-direction: column;
        }

        .folio-card:hover {
            transform: translateY(-5px);
            box-shadow: 20px 20px 0px rgba(0,0,0,0.1);
            border-color: var(--void);
        }

        .folio-cover {
            width: 100%;
            height: 380px;
            background: #eee;
            object-fit: cover;
            border: 1px solid #000;
            margin-bottom: 15px;
        }

        .folio-author {
            font-size: 12px;
            font-weight: 900;
            text-transform: uppercase;
            color: var(--ink-blue);
            margin-bottom: 5px;
        }

        .folio-title {
            font-size: 20px;
            font-weight: bold;
            line-height: 1.2;
            margin-bottom: 15px;
        }

        /* Minimal Footer */
        footer {
            margin-top: 60px;
            padding: 10px 0;
            display: flex;
            justify-content: flex-start;
        }

        .registry-link {
            text-decoration: none;
            font-family: Arial, sans-serif;
            font-size: 9px; /* Very small */
            font-weight: bold;
            letter-spacing: 1px;
            color: #666;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: color 0.2s;
        }

        .registry-link:hover {
            color: var(--void);
        }

        .star {
            color: var(--star-gold);
            font-size: 11px;
        }

        /* Reader Overlay */
        #reader-overlay {
            display: none;
            position: fixed;
            top: 0; left: 80px; right: 0; bottom: 0;
            background: #fff;
            z-index: 2000;
            flex-direction: column;
            border-left: 2px solid var(--void);
        }

        .reader-header {
            padding: 15px 30px;
            background: var(--void);
            color: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-close {
            background: #cc0000;
            color: #fff;
            border: none;
            padding: 8px 20px;
            cursor: pointer;
            font-weight: bold;
            font-family: Arial, sans-serif;
        }

        iframe {
            flex: 1;
            border: none;
        }

        @media (max-width: 768px) {
            .binding { display: none; }
            .main-stage { padding: 30px; }
            #reader-overlay { left: 0; }
        }
    </style>
</head>
<body>

    <div class="binding">
        <div class="binding-text">Alexandria</div>
    </div>

    <div class="main-stage">
        <header>
            <div class="title-block">
                <h1>Archive</h1>
                <p>Knowledge is a common treasury.</p>
            </div>
            <div style="font-weight: bold; font-size: 14px; text-align: right;">
                VOL. 2026<br>
                INDEXED REPOSITORY
            </div>
        </header>

        <div class="search-shelf">
            <input type="text" id="searchInput" placeholder="Search the repository..." onkeyup="if(event.key==='Enter')executeSearch()">
        </div>

        <div id="stacks" class="stacks">
            </div>

        <footer>
            <a href="https://star.all4you.ru/" class="registry-link">
                <span class="star">★</span>
                VETTED BY ALL4YOU REGISTRY
            </a>
        </footer>
    </div>

    <div id="reader-overlay">
        <div class="reader-header">
            <span id="current-title" style="font-size: 14px; text-transform: uppercase; font-weight: bold;">Document Viewer</span>
            <button class="btn-close" onclick="closeReader()">CLOSE VIEW</button>
        </div>
        <iframe id="reader-frame"></iframe>
    </div>

    <script>
        async function executeSearch() {
            const query = document.getElementById('searchInput').value;
            const container = document.getElementById('stacks');
            if(!query) return;

            container.innerHTML = "<p>Accessing records...</p>";

            try {
                const response = await fetch(`https://gutendex.com/books/?search=${encodeURIComponent(query)}`);
                const data = await response.json();
                container.innerHTML = "";

                data.results.forEach(book => {
                    const htmlUrl = book.formats['text/html'] || book.formats['text/html; charset=utf-8'];
                    if (htmlUrl) {
                        const card = document.createElement('div');
                        card.className = 'folio-card';
                        card.onclick = () => openReader(htmlUrl, book.title);
                        
                        const coverUrl = `https://www.gutenberg.org/cache/epub/${book.id}/pg${book.id}.cover.medium.jpg`;
                        
                        card.innerHTML = `
                            <img src="${coverUrl}" class="folio-cover" onerror="this.src='https://via.placeholder.com/300x450?text=No+Cover+Found'">
                            <span class="folio-author">${book.authors[0]?.name || 'UNKNOWN'}</span>
                            <span class="folio-title">${book.title}</span>
                        `;
                        container.appendChild(card);
                    }
                });
            } catch (e) {
                container.innerHTML = "<p>Archive connection timeout.</p>";
            }
        }

        function openReader(url, title) {
            document.getElementById('current-title').innerText = title;
            document.getElementById('reader-frame').src = url;
            document.getElementById('reader-overlay').style.display = 'flex';
        }

        function closeReader() {
            document.getElementById('reader-overlay').style.display = 'none';
            document.getElementById('reader-frame').src = '';
        }
    </script>
</body>
</html>
