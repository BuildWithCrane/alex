<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALEXANDRIA // ARCHIVE</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2280%22 fill=%22%23121212%22>📖</text></svg>">
    
    <style>
        :root {
            --concrete: #e0e0e0;
            --void: #121212;
            --paper: #ffffff;
            --ink-blue: #0047ab;
            --star-gold: #f1b51c;
            --warning-red: #cc0000;
        }

        body {
            background-color: var(--concrete);
            font-family: "Georgia", serif;
            margin: 0;
            display: flex;
            min-height: 100vh;
            color: var(--void);
        }

        .binding {
            width: 80px;
            background: var(--void);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 40px;
            position: fixed;
            height: 100vh;
            z-index: 10000;
        }

        .binding-text {
            writing-mode: vertical-rl;
            text-transform: uppercase;
            color: white;
            font-weight: 900;
            letter-spacing: 10px;
            font-size: 24px;
            transform: rotate(180deg);
        }

        .workspace {
            flex-grow: 1;
            padding: 60px 60px 40px 140px;
            max-width: 1400px;
        }

        header {
            border-bottom: 10px solid var(--void);
            margin-bottom: 40px;
            padding-bottom: 20px;
        }

        header h1 {
            font-family: "Impact", sans-serif;
            font-size: 80px;
            font-weight: 900;
            margin: 0;
            letter-spacing: -3px;
            text-transform: uppercase;
            line-height: 0.9;
        }

        .status-strip {
            font-family: Arial, sans-serif;
            font-size: 10px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
            color: var(--ink-blue);
            display: flex;
            gap: 20px;
        }

        .query-section { margin-bottom: 50px; }

        #searchBar {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 4px solid var(--void);
            font-size: 32px;
            padding: 10px 0;
            outline: none;
            font-family: "Georgia", serif;
        }

        #results {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 30px;
        }

        .folio-card {
            background: var(--paper);
            border: 1px solid #ccc;
            padding: 15px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            box-shadow: 8px 8px 0px rgba(0,0,0,0.05);
        }

        .folio-card img {
            width: 100%;
            aspect-ratio: 2/3;
            object-fit: cover;
            border: 1px solid #000;
            margin-bottom: 12px;
            background: #eee;
        }

        .folio-title { font-weight: bold; font-size: 15px; line-height: 1.2; height: 3.6em; overflow: hidden; }

        #reader {
            display: none;
            position: fixed;
            top: 0; left: 80px; width: calc(100% - 80px);
            height: 100%;
            background: #fff;
            z-index: 9999;
            flex-direction: column;
        }

        #readerHeader {
            padding: 15px 30px;
            background: var(--void);
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #closeBtn {
            background: var(--warning-red);
            border: none;
            color: white;
            padding: 8px 20px;
            cursor: pointer;
            font-weight: 900;
            text-transform: uppercase;
        }

        footer {
            margin-top: 80px;
            padding: 20px 0;
            border-top: 1px solid #ccc;
        }

        .registry-tag {
            font-family: Arial, sans-serif;
            font-size: 9px;
            font-weight: bold;
            color: #666;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
        }
    </style>
</head>
<body>

    <div class="binding"><div class="binding-text">Alexandria</div></div>

    <div class="workspace">
        <header>
            <h1>Archive</h1>
            <p style="font-style: italic; margin: 10px 0 0 5px;">Knowledge is a common treasury.</p>
        </header>

        <div class="status-strip">
            <span>Access: Decentralized Mirror Array</span>
            <span style="color: green;">● Uplink Secured</span>
        </div>

        <div class="query-section">
            <input type="text" id="searchBar" placeholder="Search the secure repository index..." onkeypress="if(event.key==='Enter') searchBooks()">
        </div>

        <div id="results"></div>

        <footer>
            <a href="https://star.all4you.ru/" class="registry-tag">
                <span style="color:var(--star-gold)">★</span> VETTED BY ALL4YOU REGISTRY
            </a>
        </footer>
    </div>

    <div id="reader">
        <div id="readerHeader">
            <span id="bookTitle" style="font-family: Arial; font-weight: bold; text-transform: uppercase; font-size: 11px;">Deciphering Record</span>
            <button id="closeBtn" onclick="closeReader()">Terminate View</button>
        </div>
        <div id="epubContainer" style="flex: 1;"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js"></script>
    <script>
        let rendition = null;
        // Obscured Node List
        const nodes = ['https://annas-archive.gl', 'https://annas-archive.li', 'https://annas-archive.se'];
        const pxy = 'https://corsproxy.io/?';

        async function searchBooks() {
            const q = document.getElementById('searchBar').value.trim();
            if (!q) return;
            const resDiv = document.getElementById('results');
            resDiv.innerHTML = "<p>QUERYING ARCHIVAL NODES...</p>";

            try {
                const response = await fetch(pxy + encodeURIComponent(`${nodes[0]}/search?q=${q}`));
                const html = await response.text();
                const doc = new DOMParser().parseFromString(html, 'text/html');
                const items = doc.querySelectorAll('a[href*="/md5/"]');
                let out = '';

                items.forEach(item => {
                    const title = item.querySelector('h3')?.textContent || "Classified Record";
                    const img = item.querySelector('img')?.src || '';
                    const path = item.getAttribute('href');
                    const link = path.startsWith('http') ? path : nodes[0] + path;

                    out += `
                        <div class="folio-card" onclick="loadAndRead('${link}', '${title.replace(/'/g, "\\'")}')">
                            <img src="${img}" onerror="this.style.display='none'">
                            <span class="folio-title">${title}</span>
                            <div style="font-size: 9px; font-weight: bold; color: var(--ink-blue); margin-top:5px;">RETRIEVAL: READY</div>
                        </div>`;
                });
                resDiv.innerHTML = out || "<p>NO RECORDS FOUND.</p>";
            } catch (e) { resDiv.innerHTML = "<p>NODE CONNECTION FAILURE.</p>"; }
        }

        async function loadAndRead(url, title) {
            document.getElementById('reader').style.display = 'flex';
            document.getElementById('bookTitle').textContent = `DECIPHERING: ${title}`;
            const container = document.getElementById('epubContainer');
            container.innerHTML = `<p style="text-align:center; padding-top: 100px;">ESTABLISHING ENCRYPTED STREAM...</p>`;

            try {
                const html = await (await fetch(pxy + encodeURIComponent(url))).text();
                const doc = new DOMParser().parseFromString(html, 'text/html');
                let target = null;
                doc.querySelectorAll('a').forEach(a => {
                    if (a.href.includes('epub') || a.textContent.toLowerCase().includes('epub')) {
                        target = a.href.startsWith('http') ? a.href : nodes[0] + a.href;
                    }
                });

                if (!target) throw new Error("STREAM UNAVAILABLE");
                const book = ePub(pxy + encodeURIComponent(target));
                if (rendition) rendition.destroy();
                rendition = book.renderTo("epubContainer", { width: "100%", height: "100%", flow: "paginated" });
                book.ready.then(() => { container.innerHTML = ''; rendition.display(); });
            } catch (e) { container.innerHTML = `<p style="text-align:center; padding: 50px; color: var(--warning-red);">SYSTEM ERROR: ${e.message}</p>`; }
        }

        function closeReader() {
            if (rendition) rendition.destroy();
            document.getElementById('reader').style.display = 'none';
        }
    </script>
</body>
</html>
